server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Запросы /api/* проксируются на backend (префикс /api отбрасывается)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
